name: fuzz
on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      examples:
        description: "Hypothesis examples per test"
        default: "20000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Property tests with a large example count
        env:
          HYPOTHESIS_PROFILE: fuzz
          HYPOTHESIS_MAX_EXAMPLES: ${{ inputs.examples || '20000' }}
        run: uv run pytest tests/unit/test_properties.py -p no:cacheprovider
      - name: Keep the failing examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples
          path: .hypothesis/
